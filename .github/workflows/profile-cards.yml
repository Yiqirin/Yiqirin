name: Profil kartlarini guncelle

on:
  schedule:
    - cron: "0 4 * * *"      # her gün 04:00 UTC (07:00 TR)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırma butonu
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kartlari uret
        env:
          # PROFILE_TOKEN tanımlıysa onu, değilse GitHub'ın otomatik token'ını kullanır
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate.py

      - name: Degisiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "chore: profil kartlarini guncelle" && git push)
